name: Integration test

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - stable*

env:
  APP_NAME: integration_onedrive

permissions:
  contents: read

concurrency:
  group: integration-test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported Nextcloud still runs on our minimum php version
          - php-versions: '8.2'
            server-versions: 'stable33'
          # Nextcloud 35 requires php 8.3 or later
          - php-versions: '8.3'
            server-versions: 'master'

    name: Integration test

    steps:
      - name: Checkout nextcloud
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: server
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Set up php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          ini-file: development
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nextcloud
        working-directory: server/
        run: |
          git submodule update --init
          php occ maintenance:install --verbose --admin-user admin --admin-pass admin

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: server/apps/${{ env.APP_NAME }}

      - name: Install dependencies
        working-directory: server/apps/${{ env.APP_NAME }}
        run: composer i

      - name: Install app
        working-directory: server/
        run: |
          php occ app:enable integration_onedrive -vvv
          sed -i '$d' config/config.php && echo "  'debug' => true," >> config/config.php && echo ");" >> config/config.php

      - name: Run Nextcloud
        working-directory: server/
        run: php -S localhost:8080 &

      - name: Run import
        working-directory: server/
        env:
          ONEDRIVE_CONFIG: ${{ secrets.ONEDRIVE_CONFIG }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          printenv ONEDRIVE_CONFIG > config.json
          php occ integration_onedrive:setup "$OAUTH_CLIENT_ID" "$OAUTH_CLIENT_SECRET"
          php occ integration_onedrive:setup-user admin "$(jq -r '.user_name' config.json)" "$(jq -r '.refresh_token' config.json)" "$(jq -r '.access_token' config.json)"
          rm -f config.json
          php occ integration_onedrive:start-import admin
          # The drive behind the secrets holds more than 500 MB, so a full import takes several
          # batches of minutes each. Import until a few files have arrived, then stop: the import
          # stays in progress, which the second run below takes into account.
          max_imported=0
          for run in {1..9}; do
            date
            echo "round $run starting"
            timeout 40 php cron.php || true
            imported=$(php occ user:setting admin integration_onedrive nb_imported_files 2>/dev/null | tail -1 || echo "0")
            skipped=$(php occ user:setting admin integration_onedrive nb_skipped_files 2>/dev/null | tail -1 || echo "0")
            failed=$(php occ user:setting admin integration_onedrive nb_failed_files 2>/dev/null | tail -1 || echo "0")
            echo "round $run: imported=$imported skipped=$skipped failed=$failed"
            if [ "$imported" -gt "$max_imported" ] 2>/dev/null; then max_imported=$imported; fi
            if [ "$imported" -gt "2" ] 2>/dev/null; then
              echo "Files imported successfully, stopping early"
              break
            fi
          done
          date
          echo "MAX_IMPORTED=$max_imported" >> "$GITHUB_ENV"

      - name: Check import result
        if: always()
        working-directory: server/
        run: |
          echo "=== Import status ==="
          for key in nb_imported_files nb_skipped_files nb_failed_files failed_files imported_size importing_onedrive onedrive_import_running last_onedrive_import_timestamp; do
            val=$(php occ user:setting admin integration_onedrive "$key" 2>/dev/null | tail -1 || echo "n/a")
            echo "  $key: $val"
          done
          echo "=== Imported files ==="
          ls -lhR "data/admin/files/OneDrive import/" 2>/dev/null || echo "No imported files found"
          echo "=== Disk usage ==="
          du -sh "data/admin/files/OneDrive import/" 2>/dev/null || echo "No import directory"

      - name: Verify import
        working-directory: server/
        run: |
          if [ "${MAX_IMPORTED:-0}" -gt "2" ] 2>/dev/null; then
            echo "Import verification passed: $MAX_IMPORTED files imported"
          else
            echo "Import verification failed: no files were imported"
            exit 1
          fi
          failed=$(php occ user:setting admin integration_onedrive nb_failed_files 2>/dev/null | tail -1 || echo "0")
          if [ "$failed" != "0" ]; then
            echo "The import reported $failed failed download(s) against a healthy drive"
            exit 1
          fi

      - name: Import a second time, the files of the first run are already there
        working-directory: server/
        run: |
          # The first import is still in progress and its job holds a lock that only expires after
          # an hour (Application::IMPORT_JOB_TIMEOUT), so clear both flags the way a user would see
          # them expire, then import again over the files that already arrived.
          php occ user:setting admin integration_onedrive onedrive_import_running 0
          php occ user:setting admin integration_onedrive importing_onedrive 0
          before=$(php occ user:setting admin integration_onedrive nb_imported_files 2>/dev/null | tail -1 || echo "0")
          php occ integration_onedrive:start-import admin
          max_skipped=0
          for run in {1..3}; do
            timeout 40 php cron.php || true
            imported=$(php occ user:setting admin integration_onedrive nb_imported_files 2>/dev/null | tail -1 || echo "0")
            skipped=$(php occ user:setting admin integration_onedrive nb_skipped_files 2>/dev/null | tail -1 || echo "0")
            failed=$(php occ user:setting admin integration_onedrive nb_failed_files 2>/dev/null | tail -1 || echo "0")
            echo "round $run: imported=$imported skipped=$skipped failed=$failed (before the second run: $before)"
            if [ "$skipped" -gt "$max_skipped" ] 2>/dev/null; then max_skipped=$skipped; fi
            if [ "$failed" != "0" ]; then
              echo "The second import reported $failed failed download(s)"
              exit 1
            fi
            if [ "$max_skipped" -gt "2" ] 2>/dev/null; then break; fi
          done
          if [ "$max_skipped" -le "2" ] 2>/dev/null; then
            echo "Expected the second import to skip the files the first one brought, it skipped $max_skipped"
            exit 1
          fi
          echo "The second import skipped $max_skipped file(s) that were already there"

      - name: Show log on failure
        working-directory: server/
        if: always()
        run: |
          tail -100 data/nextcloud.log | sed 's/"access_token":"[^"]*"/"access_token":"***"/g; s/"refresh_token":"[^"]*"/"refresh_token":"***"/g'
